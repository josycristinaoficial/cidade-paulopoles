<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Paulópolis | Site em manutenção</title>
    <meta name="description" content="O site de Paulópolis está temporariamente em manutenção.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    >
    <style>
      :root {
        --teal: #05363b;
        --coral: #f45650;
        --gold: #d8a629;
        --paper: #f8f5ed;
        --white: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
        font-family: Inter, Arial, sans-serif;
        color: var(--teal);
        text-align: center;
        color: var(--white);
        background:
          linear-gradient(rgba(5, 54, 59, 0.7), rgba(5, 54, 59, 0.7)),
          url("assets/hero-paulopolis.png") center / cover no-repeat,
          var(--teal);
      }

      .maintenance-card {
        width: min(900px, 100%);
        padding: clamp(28px, 6vw, 64px);
      }

      .eyebrow {
        margin: 0 0 16px;
        color: var(--coral);
        font-size: 0.82rem;
        font-weight: 800;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        max-width: 900px;
        font-size: clamp(2.4rem, 8vw, 5rem);
        line-height: 0.98;
        letter-spacing: 0;
        text-shadow: 0 8px 32px rgba(0, 0, 0, 0.36);
      }

      p {
        margin: 24px 0 0;
        max-width: 560px;
        color: #52686d;
        font-size: clamp(1rem, 2.5vw, 1.25rem);
        line-height: 1.55;
      }

      .brand {
        display: inline-block;
        margin-top: 30px;
        color: var(--gold);
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main class="maintenance-card" aria-labelledby="maintenance-title">
      <h1 id="maintenance-title">Estamos em manutenção</h1>
    </main>
  </body>
</html>
