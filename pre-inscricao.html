<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pré-inscrição | Paulópolis</title>
    <meta name="description" content="Formulário de pré-inscrição com análise de aprovação em Paulópolis.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Paulópolis">
        <span>Paulópolis</span>
      </a>
      <a class="header-action" href="index.html">Voltar</a>
    </header>

    <main class="form-page">
      <section class="form-section form-section-single" aria-labelledby="form-title">
        <div class="section-heading">
          <p class="eyebrow">Pré-inscrição com análise</p>
          <h1 id="form-title">Pré-inscrição Paulópolis</h1>
          <p class="form-lead">
            O 3º lote virou hoje. Valor: <strong>R$ 250k</strong>. A equipe analisará o cadastro, e a aprovação não é automática.
          </p>
        </div>

        <form class="registration-form" id="registrationForm">
          <input type="hidden" name="applicationType" value="Pré-inscrição com análise — 3º lote — R$ 250k">
          <div class="field">
            <label for="fullName">Nome</label>
            <input id="fullName" name="fullName" type="text" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="passport">Passaporte</label>
            <input id="passport" name="passport" type="text" autocomplete="off" required>
          </div>
          <div class="field">
            <label for="phone">Telefone do jogo</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" required>
          </div>
          <div class="field file-field">
            <label for="receipt">Comprovante de pagamento printado no jogo</label>
            <input id="receipt" name="receipt" type="file" accept=".jpg,.jpeg,.png,.webp" required>
            <small>Envie o print do comprovante em JPG, PNG ou WEBP.</small>
          </div>
          <label class="consent">
            <input id="consent" name="consent" type="checkbox" required>
            <span>Confirmo que as informações enviadas estão corretas.</span>
          </label>
          <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
          <button class="submit-button" type="submit">
            <span>Enviar pré-inscrição</span>
          </button>
        </form>
      </section>
    </main>

    <script src="config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
